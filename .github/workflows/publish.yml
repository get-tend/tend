# Publishes to npm when you publish a GitHub release. Tag it with the package.json version: v1.0.2 (or 1.0.2).
# Uses npm trusted publishing: no npm token is stored anywhere, and npm shows a provenance
# badge linking each version to the exact commit and workflow run that built it.
# One-time setup: on npmjs.com, open the gettend package > Settings > Trusted publishing,
# add GitHub Actions with this repository and the workflow file name "publish.yml".
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm test
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::The release tag \"$TAG\" doesn't match package.json ($version). Tag the release v$version."
            exit 1
          fi
      - run: npm publish --provenance --access public
