<!-- Cookieless page counts. Turn on Web Analytics for this project in Vercel; until then this request just 404s. -->
<script defer src="/_vercel/insights/script.js"></script>
<script>
// Uses the theme chosen in the homepage footer, if any.
try{const t=localStorage.getItem('tend.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch{}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a methods appendix. One readable column, the table set wide, notes in the margin of the text. */
:root{
  --bg:#E9EEEA; --surface:#F6F8F5; --paper:#FCFCF8; --ink:#13201A; --muted:#55645C; --line:#C9D3CC; --moss:#2E6A4C;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1512;--surface:#151E1A;--paper:#1C2621;--ink:#E4ECE6;--muted:#97A79E;--line:#2C3A33;--moss:#7CC39C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1512;--surface:#151E1A;--paper:#1C2621;--ink:#E4ECE6;--muted:#97A79E;--line:#2C3A33;--moss:#7CC39C;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:3px;border-radius:6px}
.back{font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
h1,h2{font-family:var(--display);letter-spacing:-.025em;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,6vw,64px);font-weight:800;margin-top:40px}
h2{font-size:28px;font-weight:800;margin-top:72px}
p{margin:16px 0 0;max-width:64ch}
.lead{font-size:20px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.formula{margin-top:20px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font:14px/1.9 var(--mono);overflow-x:auto;white-space:pre}
.tbl{margin-top:24px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:600px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--surface);font-size:13px}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
ul{margin:16px 0 0;padding-left:20px;display:grid;gap:6px;max-width:64ch}
.aside{margin-top:24px;border-left:3px solid var(--moss);padding-left:16px}
.log{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--line);max-width:64ch}
.log li{display:grid;grid-template-columns:90px 1fr;gap:2px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.log b{color:var(--moss);font-weight:600}
.log small{grid-column:2;color:var(--muted);font-size:13px}
.version{margin-top:72px;padding-top:20px;border-top:1px solid var(--line);font:13px var(--mono);color:var(--muted)}

.done{display:grid;gap:22px;justify-items:start;margin-top:56px;max-width:600px}
.seal{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--moss) 18%,var(--paper));color:var(--moss)}
.seal svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.done h1{margin-top:0}
.done .lead{margin-top:0}
.next{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:grid;gap:12px;width:100%}
.next h2{font-size:20px;margin:0}
.next p{margin:0;color:var(--muted);font-size:16px}
.cmd{display:inline-flex;align-items:center;gap:12px;width:max-content;max-width:100%;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font:500 16px var(--mono);border:0;cursor:pointer}
.cmd span{opacity:.55}
.cmd i{font-style:normal;font-size:12px;background:color-mix(in srgb,var(--bg) 16%,transparent);padding:4px 8px;border-radius:7px}
.home{font-weight:600;text-decoration:none;border-bottom:2px solid var(--moss);padding-bottom:2px}
</style>
</head>
<body>
<div class="wrap" id="top">
  <a class="back" href="/">← Tend</a>
  <div class="done">
    <span class="seal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <h1 id="title">You're confirmed.</h1>
    <p class="lead" id="lead">You're on the Startup waitlist. We're choosing 8 design partner teams to start in January 2027, and we'll email you before then.</p>
    <div class="next">
      <h2>While you wait</h2>
      <p>See your own Claude Code footprint. Tend runs on your computer and sends nothing anywhere.</p>
      <button class="cmd" id="copy" type="button" aria-label="Copy install command"><span>$</span> npx gettend-cli <i>copy</i></button>
    </div>
    <a class="home" href="/">Back to Tend</a>
  </div>
</div>
<script>
// One page for every Tend list. Kit sends people here after they confirm; ?list= picks the wording.
const COPY={
  ask:["Your name is on the letter.","Thank you for asking AI providers to publish their footprint. We'll email you when the letter goes out, and again when providers reply."],
};
const list=new URLSearchParams(location.search).get('list');
if(COPY[list]){document.getElementById('title').textContent=COPY[list][0];document.getElementById('lead').textContent=COPY[list][1];}
const copyBtn=document.getElementById('copy');
copyBtn.addEventListener('click',()=>{
  navigator.clipboard?.writeText('npx gettend-cli').then(()=>{copyBtn.querySelector('i').textContent='copied'});
});
if('scrollRestoration' in history)history.scrollRestoration='manual';
window.scrollTo(0,0);
</script>
</body>
</html>
